name: Release

# A published GitHub release (tag vX.Y.Z, matching package.json) deploys the web app to GitHub Pages
# and uploads the signed Play bundle (.aab) to a Play Console track (internal by default). It also
# attaches the sideload APK (`android:release -- --sideload`) to the release: its own app id
# (kr.potatosalad775.unipeq.sideload) and key, so it installs beside the Play app and Play Protect
# doesn't take it for a re-signed copy. It tells its users about newer releases, which it finds
# through GitHub's releases/latest: that skips pre-releases, and a release counts only once its APK
# is attached. `npm run release` (scripts/release.mjs) bumps, tags and publishes the release.
# A pre-release uploads the bundle but leaves the website alone. A manual run deploys the website
# and keeps the bundle as a workflow artifact instead of uploading it (Play refuses a versionCode
# twice, so only releases upload); so does a release while PLAY_SERVICE_ACCOUNT_JSON is unset.
#
# One-time setup:
#   Settings → Pages → Source: "GitHub Actions" (this creates the github-pages environment), then
#   Settings → Environments → github-pages → deployment branches and tags: add the tag rule `v*`.
#   Play: a Google Cloud service account with the Android Publisher API enabled, invited in Play
#   Console → Users and permissions with release rights for the app.
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (`base64 -i keystore.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON  the service account's JSON key
#   SIDELOAD_KEYSTORE_BASE64   base64 of the sideload APK's keystore (not the upload keystore).
#                              Keep it forever: a new key can't update existing installs.
#   SIDELOAD_KEYSTORE_PASSWORD
#   SIDELOAD_KEY_ALIAS
#   SIDELOAD_KEY_PASSWORD      Without these four the APK is skipped.
#
# Repository variables (optional):
#   PLAY_TRACK                 internal (default), alpha, beta or production
#   PLAY_RELEASE_STATUS        completed (default) or draft. Play only takes drafts until the app's
#                              first release has been reviewed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version, check the tag matches
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match package.json (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v6
        id: pages

      - run: npm ci

      # BASE_PATH is the site's path (`/uniPEQ`, or empty on a custom domain); svelte.config.js
      # reads it.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Pages answers unknown paths with 404.html: the SPA shell, so deep links like /uniPEQ/presets
      # load and route client-side.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deploy

  android:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to the release
    env:
      # Secrets can't be tested in `if:`. Only whether it's set, so the key itself reaches no step
      # but the upload (not npm's install scripts).
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_SIDELOAD_KEY: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Zulu 21: what android/gradle/gradle-daemon-jvm.properties asks for (see CONTRIBUTING.md).
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: npm ci

      # The upload key, and the sideload APK's key under `sideload.` when its secrets are set.
      - name: Write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          if [ -n "$SIDELOAD_KEYSTORE_BASE64" ]; then
            echo "$SIDELOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sideload.jks"
            {
              echo "sideload.storeFile=$RUNNER_TEMP/sideload.jks"
              echo "sideload.storePassword=$SIDELOAD_KEYSTORE_PASSWORD"
              echo "sideload.keyAlias=$SIDELOAD_KEY_ALIAS"
              echo "sideload.keyPassword=$SIDELOAD_KEY_PASSWORD"
            } >> android/key.properties
          fi

      - run: npm run android:release

      - name: Name the bundle after the version
        id: bundle
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "out/uniPEQ-${{ needs.version.outputs.version }}.aab"

      # Each output depends only on the build it ships, not on the steps before it: a failed Play
      # upload still keeps the bundle and still builds and attaches the sideload APK.
      - name: Upload to Play
        id: play
        if: github.event_name == 'release' && env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kr.potatosalad775.unipeq
          releaseFiles: out/uniPEQ-${{ needs.version.outputs.version }}.aab
          releaseName: ${{ needs.version.outputs.version }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Keep the bundle as a workflow artifact
        if: >-
          !cancelled() && steps.bundle.outcome == 'success' && (github.event_name != 'release' ||
          env.HAS_PLAY_KEY != 'true' || steps.play.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: uniPEQ-${{ needs.version.outputs.version }}-aab
          path: out/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Build the sideload APK
        id: apk
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && env.HAS_SIDELOAD_KEY == 'true' }}
        run: |
          npm run android:release -- --sideload
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/uniPEQ-${{ needs.version.outputs.version }}.apk"

      - name: Attach the APK to the release
        if: ${{ !cancelled() && steps.apk.outcome == 'success' && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "out/uniPEQ-${{ needs.version.outputs.version }}.apk" \
            --repo "${{ github.repository }}" --clobber

      - name: Keep the APK as a workflow artifact
        if: ${{ !cancelled() && steps.apk.outcome == 'success' && github.event_name != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: uniPEQ-${{ needs.version.outputs.version }}-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
