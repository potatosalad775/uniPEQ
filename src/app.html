<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: the WebView draws edge to edge; layout.css pads by the safe-area insets. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>uniPEQ</title>
		<meta name="description" content="Parametric EQ control for USB and Bluetooth audio devices." />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<!--
			Pretendard Variable (Korean-optimized, dynamic subset). Preloaded, then swapped to a
			stylesheet on load so a slow or offline CDN never holds back boot; the font stack in
			layout.css falls back to system fonts.
		-->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="preload"
			as="style"
			crossorigin
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
			onload="
				this.onload = null;
				this.rel = 'stylesheet';
			"
		/>
		<!--
			Applies the saved theme before first paint, so a dark-theme launch doesn't flash light.
			Mirrors resolveDark() in $lib/stores/settings-store.svelte.ts and its storage key.
		-->
		<script>
			try {
				var t = JSON.parse(localStorage.getItem('unipeq.settings') || '{}').theme;
				var dark =
					t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
