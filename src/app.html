<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: the WebView draws edge to edge; layout.css pads by the safe-area insets. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>uniPEQ</title>
		<meta name="description" content="Parametric EQ control for USB and Bluetooth audio devices." />
		<!-- Rendered from resources/icon.svg by `npm run icons`. -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- base-100 of each theme (src/lib/styles/theme.css), as hex. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d232a" />
		<!--
			Applies the saved theme before first paint, so a dark-theme launch doesn't flash light.
			Mirrors resolveDark() in $lib/stores/settings-store.svelte.ts and its storage key.
		-->
		<script>
			try {
				var t = JSON.parse(localStorage.getItem('unipeq.settings') || '{}').theme;
				var dark =
					t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			} catch (e) {}
		</script>
		<!--
			base-100 before the stylesheet loads, so the Android splash (the same colours) hands over
			to the page without the WebView's blank canvas, black in dark mode, in between.
		-->
		<style>
			html {
				background: #f8fafc;
			}
			html.dark {
				background: #1d232a;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
