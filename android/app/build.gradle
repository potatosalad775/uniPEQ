import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The version lives in package.json only (`npm version …`). versionName is it verbatim;
// versionCode is MAJOR*10000 + MINOR*100 + PATCH, so 1.2.3 → 10203 and every bump raises it.
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version as String
def versionParts = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!versionParts.find()) throw new GradleException("package.json version '$appVersion' is not MAJOR.MINOR.PATCH")
def (major, minor, patch) = (1..3).collect { versionParts.group(it) as int }
if (minor > 99 || patch > 99) throw new GradleException("versionCode scheme needs MINOR and PATCH ≤ 99 ($appVersion)")

// `-Psideload` (`npm run android:release -- --sideload`): the APK attached to GitHub releases. It's
// its own app (`.sideload` id), so it installs beside the Play one and Play Protect doesn't take it
// for a re-signed copy of it, and it's signed with its own key, not the Play upload key.
def sideload = project.hasProperty('sideload')

// Release signing: android/key.properties (gitignored; see key.properties.example). Written by
// hand locally, by the release workflow in CI. The sideload build reads the `sideload.`-prefixed
// entries. Without them a release build comes out unsigned.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) keyPropertiesFile.withInputStream { keyProperties.load(it) }
def keyPrefix = sideload ? 'sideload.' : ''
def hasReleaseKey = keyProperties[keyPrefix + 'storeFile'] != null

android {
    namespace = "kr.potatosalad775.unipeq"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId sideload ? "kr.potatosalad775.unipeq.sideload" : "kr.potatosalad775.unipeq"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(keyProperties[keyPrefix + 'storeFile'])
                storePassword keyProperties[keyPrefix + 'storePassword']
                keyAlias keyProperties[keyPrefix + 'keyAlias']
                keyPassword keyProperties[keyPrefix + 'keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
